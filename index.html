/* Layout: clip-index rail on the left; the viewer and three quick questions on the right. On phones the rail becomes a scrolling strip. */
:root{
  --bg:#F2F4F1; --panel:#FFFFFF; --ink:#16201B; --muted:#56635C; --line:#D6DDD8;
  --accent:#0A7560; --accent-ink:#FFFFFF; --accent-soft:#DBEEE8;
  --warn:#8F5B00; --warn-soft:#FAEFD8; --danger:#B42318; --danger-soft:#FBE4E1;
  --chip:#E6EBE7; --screen:#0B0E0D;
  --font-body: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1311; --panel:#161C19; --ink:#E2EAE5; --muted:#98A69E; --line:#29332E;
    --accent:#3DC6A4; --accent-ink:#04241C; --accent-soft:#143A30;
    --warn:#E6AA42; --warn-soft:#382A10; --danger:#F2776C; --danger-soft:#3A1B18;
    --chip:#1F2723; --screen:#050706; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1311; --panel:#161C19; --ink:#E2EAE5; --muted:#98A69E; --line:#29332E;
  --accent:#3DC6A4; --accent-ink:#04241C; --accent-soft:#143A30;
  --warn:#E6AA42; --warn-soft:#382A10; --danger:#F2776C; --danger-soft:#3A1B18;
  --chip:#1F2723; --screen:#050706; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.55}
.wrap{max-width:1360px;margin:0 auto;padding-inline:16px;padding-block:14px 28px;display:grid;gap:12px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line)}
.brand{display:grid;min-width:0}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
h1{font-family:var(--font-display);font-weight:600;font-size:26px;line-height:1.1;margin:0;letter-spacing:.01em;text-wrap:balance}
.meter{display:grid;gap:4px;min-width:160px;flex:1 1 200px;max-width:340px}
.meter-text{font-variant-numeric:tabular-nums;color:var(--muted)}
.meter-text b{color:var(--ink);font-family:var(--font-mono)}
.bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .25s ease}
.rater{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.rater input{width:10em;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:4px 8px}
.lang{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px}
.status{font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);max-width:100%}
.status[data-state="ok"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.status[data-state="local"]{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.status[data-state="error"]{color:var(--danger);border-color:var(--danger);background:var(--danger-soft)}

.guide{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding-inline:14px;padding-block:8px}
.guide summary{cursor:pointer;font-weight:600}
.guide ul{margin:8px 0 4px;padding-left:20px;display:grid;gap:4px;max-width:80ch}
kbd{font-family:var(--font-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--chip)}

.layout{display:grid;grid-template-columns:232px minmax(0,1fr);gap:16px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);display:grid;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.rail-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:6px;cursor:pointer}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-height:min(70vh,640px);overflow:auto;padding:2px}
.chip{font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums;padding:5px 0;border-radius:5px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--muted)}
.chip.done{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip.current{outline:2px solid var(--ink);outline-offset:1px;color:var(--ink)}

.stage{display:grid;gap:14px;min-width:0}
.viewer{display:grid;gap:8px;min-width:0}
.viewer-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.vid{font-family:var(--font-display);font-size:30px;font-weight:600;line-height:1}
.family{font-size:13px;padding:2px 8px;border-radius:4px;background:var(--chip);color:var(--muted)}
.pos{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-left:auto}
.video-box{background:var(--screen);border-radius:var(--radius);overflow:hidden;aspect-ratio:53/30;max-width:100%;display:grid;place-items:center}
.video-box video{width:100%;height:100%;object-fit:contain;display:block}
.video-tools{display:flex;flex-wrap:wrap;gap:6px}
.video-tools button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px}
.video-tools button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.prompt{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;display:grid;gap:4px;min-width:0}
.prompt .label{font-size:12px;color:var(--muted);letter-spacing:.04em}
.prompt p{margin:0;max-height:5.4em;overflow:auto;font-size:13px;line-height:1.5;overflow-wrap:anywhere}

.sheet{display:grid;gap:12px}
.qs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.q{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:10px 12px 12px;margin:0;min-width:0;display:grid;gap:6px;align-content:start}
.q.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.q.missing{border-color:var(--danger);background:var(--danger-soft)}
legend{font-weight:600;padding:0 4px;display:flex;align-items:baseline;gap:8px}
legend .qn{font-family:var(--font-mono);font-size:12px;color:var(--accent)}
.opt{display:grid;grid-template-columns:1.8em minmax(0,1fr);align-items:start;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.opt:hover{background:var(--chip)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .key{font-family:var(--font-mono);font-size:12px;border:1px solid var(--line);border-radius:4px;text-align:center;line-height:1.6}
.opt:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.opt:has(input:checked) .key{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:1px}
.more{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding-inline:12px;padding-block:8px}
.more summary{cursor:pointer;font-weight:600}
.more-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:8px}
.mg{display:grid;gap:2px;align-content:start;min-width:0}
.mg b{font-size:13px}
.mg label{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px;align-items:start;font-size:13px;padding:2px 0;cursor:pointer}
.mg label input{margin:3px 0 0}
.note{display:grid;gap:6px}
.note label{font-weight:600}
textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:8px;resize:vertical;min-height:2.6em}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:sticky;bottom:0;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.actions .spacer{flex:1 1 auto;min-width:0}
.msg{font-size:13px;color:var(--muted);min-width:0}
.msg.err{color:var(--danger)}
.msg.ok{color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.foot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:12px}
.foot textarea{font-family:var(--font-mono);font-size:11px;min-height:6em}

@media (max-width: 1080px){ .qs, .more-grid{grid-template-columns:minmax(0,1fr)} }
@media (max-width: 860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .rail{position:static}
  .chips{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:3.6em;overflow-x:auto;max-height:none;padding-bottom:6px}
}
@media (prefers-reduced-motion: reduce){ .bar span{transition:none} }

</head>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="eyebrow" data-i18n="eyebrow"></span>
      <h1 data-i18n="title"></h1>
    </div>
    <div class="meter" aria-live="polite">
      <div class="meter-text" id="meterText"></div>
      <div class="bar"><span id="barFill"></span></div>
    </div>
    <label class="rater" for="rater"><span data-i18n="rater"></span> <input id="rater" type="text" autocomplete="name"></label>
    <button type="button" class="lang" id="langBtn"></button>
    <div class="status" id="status" data-state="pending"></div>
  </header>

  <details class="guide" id="guide" open>
    <summary data-i18n="guideTitle"></summary>
    <ul>
      <li data-i18n-html="guide1"></li>
      <li data-i18n="guide2"></li>
      <li data-i18n="guide3"></li>
      <li data-i18n-html="guide4"></li>
    </ul>
  </details>

  <div class="layout">
    <aside class="rail" id="rail">
      <div class="rail-head">
        <span data-i18n="clips"></span>
        <label class="toggle"><input type="checkbox" id="onlyTodo"> <span data-i18n="onlyTodo"></span></label>
      </div>
      <div class="chips" id="chips"></div>
    </aside>

    <main class="stage">
      <section class="viewer" id="viewer">
        <div class="viewer-head">
          <span class="vid" id="vidLabel">v001</span>
          <span class="family" id="family"></span>
          <span class="pos" id="pos">1 / 78</span>
        </div>
        <div class="video-box">
          <video id="player" muted loop playsinline autoplay controls preload="auto"></video>
        </div>
        <div class="video-tools" id="tools">
          <button type="button" data-rate="0.5" data-i18n="slow"></button>
          <button type="button" data-rate="1" class="on" data-i18n="normal"></button>
          <button type="button" id="replay" data-i18n="replay"></button>
        </div>
        <div class="prompt">
          <span class="label" data-i18n="promptLabel"></span>
          <p id="prompt"></p>
        </div>
      </section>

      <form class="sheet" id="sheet" novalidate>
        <div class="qs" id="qs"></div>
        <details class="more" id="more">
          <summary data-i18n="moreTitle"></summary>
          <div class="more-grid" id="moreGrid"></div>
        </details>
        <div class="note">
          <label for="note" data-i18n="noteLabel"></label>
          <textarea id="note" rows="2"></textarea>
        </div>
        <div class="actions">
          <button type="button" class="btn" id="prev" data-i18n="prev"></button>
          <span class="msg" id="msg"></span>
          <span class="spacer"></span>
          <button type="button" class="btn" id="skip" data-i18n="next"></button>
          <button type="submit" class="btn primary" id="save" data-i18n="save"></button>
        </div>
      </form>
    </main>
  </div>

  <footer class="foot">
    <span id="footNote"></span>
    <button type="button" class="btn" id="copyAll" data-i18n="copyAll"></button>
    <textarea id="copyBox" hidden readonly></textarea>
  </footer>
</div>

      ["parallax", {zh:"真的在移动（近处比远处动得快）", en:"Really travels (near things move faster than far ones)"}],

    {key:"q2", title:{zh:"场景", en:"Scene"}, opts:[
      ["none", {zh:"没有东西变", en:"Nothing changes"}],
      ["plausible", {zh:"有合理的运动（人、动物、水、火、风）", en:"Plausible motion (people, animals, water, fire, wind)"}],
      ["inconsistent", {zh:"有不合理的变化（变形、凭空出现或消失、转回来对不上）", en:"Implausible change (deforms, appears or vanishes, differs when the view returns)"}],
      ["unsure", {zh:"说不准", en:"Not sure"}]]},
    {key:"q3", title:{zh:"能当一个静态三维场景的拍摄吗", en:"Could this serve as a capture of one static 3D scene?"}, opts:[
      ["yes", {zh:"能", en:"Yes"}],
      ["mostly", {zh:"大体能，有局部问题", en:"Mostly, with local problems"}],
      ["no", {zh:"不能", en:"No"}],
      ["unsure", {zh:"说不准", en:"Not sure"}]]}
  ];
  const MORE = [
    {title:{zh:"镜头细节", en:"Camera details"}, opts:[
      ["A8", {zh:"运动方向和提示词不符", en:"Motion direction differs from the prompt"}],
      ["A9", {zh:"运动幅度很小", en:"Very small motion"}],
      ["A10", {zh:"中途有剪辑或镜头切换", en:"Cut or shot change"}],
      ["A6", {zh:"镜头抖动、来回或跳变", en:"Shaky, back-and-forth or jumpy camera"}]]},
    {title:{zh:"内容细节", en:"Content details"}, opts:[
      ["B2", {zh:"物体整体移动或转动（刚体）", en:"An object moves or turns as a whole (rigid)"}],
      ["B3", {zh:"物体非刚性变形", en:"Non-rigid deformation"}],
      ["B4", {zh:"物体凭空出现或消失", en:"Objects appear or vanish"}],
      ["B5", {zh:"结构或数量前后不一致", en:"Structure or count changes"}],
      ["B6", {zh:"背景或布局在变", en:"Background or layout changes"}],
      ["B7", {zh:"纹理、颜色或光照闪烁", en:"Texture, color or lighting flickers"}],
      ["B8", {zh:"转过去再转回来对不上", en:"Content differs when the view returns"}]]},
    {title:{zh:"画面细节", en:"Image details"}, opts:[
      ["C1", {zh:"模糊", en:"Blurry"}],
      ["C2", {zh:"明显伪影", en:"Visible artifacts"}],
      ["C3", {zh:"细节非常丰富", en:"Very rich detail"}],
      ["C4", {zh:"画面很简单，几乎没有纹理", en:"Very plain, almost no texture"}],
      ["C5", {zh:"反光、透明、玻璃或水面", en:"Reflections, transparency, glass or water"}],
      ["C6", {zh:"文字、水印或字幕", en:"Text, watermark or captions"}],
      ["C7", {zh:"内容与提示词不符", en:"Content does not match the prompt"}]]}
  ];
  const STORE_KEY = "o31-labels-v2", RATER_KEY = "o31-rater", LANG_KEY = "o31-lang";
  const $ = id => document.getElementById(id);

  let lang = "zh";
  try { lang = localStorage.getItem(LANG_KEY) || ((navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en"); } catch(e) {}
  if (!T[lang]) lang = "zh";
  const t = (key, vars) => { let s = (T[lang] && T[lang][key]) || T.zh[key] || key; if (vars) for (const k in vars) s = s.replace("{" + k + "}", vars[k]); return s; };

  let manifest = [];
  try { manifest = (JSON.parse($("manifest").textContent).videos || []).map(v => ({id:v.id, file:v.filename, prompt:v.prompt, family:v.motion_prompt_family})); } catch(e) { manifest = []; }
  const total = manifest.length;

  let labels = {};
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) labels = JSON.parse(raw) || {}; } catch(e) { labels = {}; }
  let cur = 0, rate = 1, serverOK = false, skipArmed = false, saving = false, activeQ = 0;
  let statusKey = "stPending", statusState = "pending", footKey = "footPublic", msgState = {key:"", vars:null, kind:""};
  try { $("rater").value = localStorage.getItem(RATER_KEY) || ""; } catch(e) {}
  $("rater").addEventListener("change", () => { try { localStorage.setItem(RATER_KEY, $("rater").value.trim()); } catch(e) {} });
  async function postVote(rec){
    const r = await fetch("/api/vote", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(rec)});
    if (!r.ok) throw new Error("http " + r.status);
    return r.json();
  }

  // ---- build questions ----
  const textRefs = [];
  const qsEl = $("qs");
  QUESTIONS.forEach((q, qi) => {
    const fs = document.createElement("fieldset");
    fs.className = "q"; fs.id = "q-" + q.key;
    const lg = document.createElement("legend");
    const qn = document.createElement("span"); qn.className = "qn";
    const tt = document.createElement("span");
    textRefs.push(() => { qn.textContent = t("qn", {n: qi + 1}); tt.textContent = q.title[lang]; });
    lg.append(qn, tt); fs.appendChild(lg);
    q.opts.forEach(([val, text], oi) => {
      const lab = document.createElement("label"); lab.className = "opt";
      const inp = document.createElement("input"); inp.type = "radio"; inp.name = q.key; inp.value = val; inp.id = "opt-" + q.key + "-" + val;
      const key = document.createElement("span"); key.className = "key"; key.textContent = String(oi + 1);
      const tx = document.createElement("span");
      textRefs.push(() => { tx.textContent = text[lang]; });
      lab.append(inp, key, tx);
      inp.addEventListener("change", () => { setActive(Math.min(qi + 1, QUESTIONS.length - 1)); maybeAutoSave(qi); });
      fs.appendChild(lab);
    });
    fs.addEventListener("click", () => setActive(qi));
    qsEl.appendChild(fs);
  });
  const moreEl = $("moreGrid");
  MORE.forEach(g => {
    const box = document.createElement("div"); box.className = "mg";
    const b = document.createElement("b"); box.appendChild(b);
    textRefs.push(() => { b.textContent = g.title[lang]; });
    g.opts.forEach(([code, text]) => {
      const lab = document.createElement("label");
      const inp = document.createElement("input"); inp.type = "checkbox"; inp.name = "more"; inp.value = code; inp.id = "more-" + code;
      const tx = document.createElement("span");
      textRefs.push(() => { tx.textContent = text[lang]; });
      lab.append(inp, tx); box.appendChild(lab);
    });
    moreEl.appendChild(box);
  });

  function applyLang(){
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
    $("rater").placeholder = t("raterPh");
    $("note").placeholder = t("notePh");
    $("langBtn").textContent = t("langBtn");
    $("rail").setAttribute("aria-label", t("clips"));
    $("copyBox").setAttribute("aria-label", t("copyAll"));
    textRefs.forEach(fn => fn());
    $("status").textContent = t(statusKey);
    $("footNote").textContent = t(footKey);
    if (msgState.key) setMsg(msgState.key, msgState.vars, msgState.kind);
    renderChips();
    if (manifest[cur]){ const f = manifest[cur].family; $("family").textContent = t("familyPrefix") + ((T[lang].fam || {})[f] || f || "—"); }
  }
  $("langBtn").addEventListener("click", () => { lang = lang === "zh" ? "en" : "zh"; try { localStorage.setItem(LANG_KEY, lang); } catch(e) {} applyLang(); });

  function setActive(i){ activeQ = i; QUESTIONS.forEach((q, qi) => $("q-" + q.key).classList.toggle("active", qi === i)); }
  function readForm(){
    const out = {};
    QUESTIONS.forEach(q => { const c = document.querySelector('input[name="' + q.key + '"]:checked'); out[q.key] = c ? c.value : null; });
    out.more = [...document.querySelectorAll('input[name="more"]:checked')].map(i => i.value);
    out.note = $("note").value.trim();
    return out;
  }
  function fillForm(rec){
    QUESTIONS.forEach(q => {
      document.querySelectorAll('input[name="' + q.key + '"]').forEach(i => { i.checked = !!rec && rec[q.key] === i.value; });
      $("q-" + q.key).classList.remove("missing");
    });
    const more = rec && rec.more ? rec.more : [];
    document.querySelectorAll('input[name="more"]').forEach(i => { i.checked = more.includes(i.value); });
    $("note").value = rec && rec.note ? rec.note : "";
    if (more.length) $("more").open = true;
    const firstEmpty = QUESTIONS.findIndex(q => !(rec && rec[q.key]));
    setActive(firstEmpty === -1 ? 0 : firstEmpty);
  }
  function sameAsSaved(){
    const f = readForm(), s = labels[manifest[cur].id];
    if (!s) return QUESTIONS.every(q => !f[q.key]) && f.more.length === 0 && !f.note;
    return QUESTIONS.every(q => f[q.key] === (s[q.key] || null)) && JSON.stringify([...f.more].sort()) === JSON.stringify([...(s.more || [])].sort()) && f.note === (s.note || "");
  }
  function maybeAutoSave(qi){
    if (qi !== QUESTIONS.length - 1) return;
    const f = readForm();
    if (QUESTIONS.every(q => f[q.key]) && !$("more").open) $("sheet").requestSubmit();
  }

  // ---- chips ----
  const chipsEl = $("chips");
  manifest.forEach((v, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = v.id.replace(/^v/, ""); b.title = v.id;
    b.addEventListener("click", () => go(i));
    chipsEl.appendChild(b);
  });
  function renderChips(){
    const only = $("onlyTodo").checked;
    let done = 0;
    [...chipsEl.children].forEach((b, i) => {
      const isDone = !!labels[manifest[i].id];
      if (isDone) done++;
      b.classList.toggle("done", isDone);
      b.classList.toggle("current", i === cur);
      b.hidden = only && isDone && i !== cur;
    });
    $("meterText").textContent = t("meter", {done: done, total: total});
    $("barFill").style.width = (total ? (100 * done / total) : 0) + "%";
    return done;
  }

  // ---- navigation ----
  const player = $("player");
  function go(i){
    if (i < 0 || i >= total) return;
    cur = i; skipArmed = false; setMsg("");
    const v = manifest[i];
    $("vidLabel").textContent = v.id;
    $("pos").textContent = (i + 1) + " / " + total;
    $("family").textContent = t("familyPrefix") + ((T[lang].fam || {})[v.family] || v.family || "—");
    $("prompt").textContent = v.prompt || "";
    player.src = v.file; player.playbackRate = rate;
    const p = player.play(); if (p && p.catch) p.catch(() => {});
    $("more").open = false;
    fillForm(labels[v.id]);
    renderChips();
    const chip = chipsEl.children[i]; if (chip && chip.scrollIntoView) chip.scrollIntoView({block:"nearest", inline:"nearest"});
  }
  function nextIndex(from){
    const only = $("onlyTodo").checked;
    for (let k = 1; k <= total; k++){ const j = (from + k) % total; if (!only || !labels[manifest[j].id]) return j; }
    return -1;
  }
  player.addEventListener("loadedmetadata", () => { player.playbackRate = rate; });
  $("tools").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "replay"){ player.currentTime = 0; const p = player.play(); if (p && p.catch) p.catch(() => {}); return; }
    rate = Number(b.dataset.rate) || 1; player.playbackRate = rate;
    $("tools").querySelectorAll("button[data-rate]").forEach(x => x.classList.toggle("on", x === b));
  });

  function setMsg(key, vars, kind){
    msgState = {key: key || "", vars: vars || null, kind: kind || ""};
    const m = $("msg"); m.textContent = key ? t(key, vars) : ""; m.className = "msg" + (kind ? " " + kind : "");
  }
  function setStatus(state, key){ statusState = state; statusKey = key; const s = $("status"); s.dataset.state = state; s.textContent = t(key); }
  function persistLocal(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(labels)); } catch(e) {} }

  // ---- save ----
  $("sheet").addEventListener("submit", async e => {
    e.preventDefault();
    if (saving) return;
    const f = readForm();
    let ok = true;
    QUESTIONS.forEach(q => { const miss = !f[q.key]; $("q-" + q.key).classList.toggle("missing", miss); if (miss) ok = false; });
    if (!ok){ setMsg("needAll", null, "err"); return; }
    const rater = $("rater").value.trim();
    if (!serverOK && !rater){ setMsg("needRater", null, "err"); $("rater").focus(); return; }
    const v = manifest[cur];
    const body = {vid: v.id, q1: f.q1, q2: f.q2, q3: f.q3, more: f.more, note: f.note, rater: rater, lang: lang, updatedAt: new Date().toISOString(), schema: "O31-v2"};
    labels[v.id] = body; persistLocal(); renderChips();
    if (serverOK){
      saving = true; $("save").disabled = true;
      try { await postVote(body); }
      catch(err){ setMsg("saveFail", null, "err"); setStatus("error", "stError"); saving = false; $("save").disabled = false; return; }
      saving = false; $("save").disabled = false;
    }
    const n = nextIndex(cur);
    if (n === -1){ setMsg("allDone", {total: total}, "ok"); return; }
    go(n);
    setMsg("saved", {id: v.id}, "ok");
  });

  $("prev").addEventListener("click", () => go((cur - 1 + total) % total));
  $("skip").addEventListener("click", () => {
    if (!sameAsSaved() && !skipArmed){ skipArmed = true; setMsg("unsaved", null, "err"); return; }
    const n = nextIndex(cur); go(n === -1 ? (cur + 1) % total : n);
  });
  $("onlyTodo").addEventListener("change", renderChips);
  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter"){ e.preventDefault(); $("sheet").requestSubmit(); return; }
    const el = e.target;
    if (el && (el.tagName === "TEXTAREA" || (el.tagName === "INPUT" && el.type === "text"))) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[1-4]$/.test(e.key)){
      e.preventDefault();
      const q = QUESTIONS[activeQ];
      const inp = document.querySelectorAll('input[name="' + q.key + '"]')[Number(e.key) - 1];
      if (inp){ inp.checked = true; inp.dispatchEvent(new Event("change")); }
      return;
    }
    if (e.key === "ArrowRight"){ e.preventDefault(); $("skip").click(); }
    if (e.key === "ArrowLeft"){ e.preventDefault(); $("prev").click(); }
  });

  $("copyAll").addEventListener("click", async () => {
    const text = JSON.stringify({schema:"O31-v2", rater:$("rater").value.trim(), exportedAt:new Date().toISOString(), count:Object.keys(labels).length, labels}, null, 1);
    const box = $("copyBox"); box.value = text; box.hidden = false;
    try { await navigator.clipboard.writeText(text); setMsg("copied", null, "ok"); }
    catch(e){ box.focus(); box.select(); setMsg("copyFail", null, "err"); }
  });

  applyLang();
  const firstTodo = manifest.findIndex(v => !labels[v.id]);
  go(firstTodo === -1 ? 0 : firstTodo);

  // ---- local save service (serve.py on the author's computer); the public site has none ----
  (async () => {
    try {
      const r = await fetch("/api/votes", {cache: "no-store"});
      if (!r.ok) throw new Error("http " + r.status);
      const remote = (await r.json()).labels || {};
      for (const [id, rem] of Object.entries(remote)){
        if (!rem || rem.schema !== "O31-v2") continue;
        const loc = labels[id];
        if (!loc || (rem.updatedAt || "") >= (loc.updatedAt || "")) labels[id] = rem;
      }
      for (const [id, loc] of Object.entries(labels)){
        const rem = remote[id];
        if (!rem || rem.schema !== "O31-v2" || (loc.updatedAt || "") > (rem.updatedAt || "")){ try { await postVote(loc); } catch(e) {} }
      }
      serverOK = true;
      persistLocal(); renderChips();
      if (!document.activeElement || !document.activeElement.closest || !document.activeElement.closest("#sheet")) fillForm(labels[manifest[cur].id]);
      setStatus("ok", "stOk"); footKey = "footLocal"; $("footNote").textContent = t(footKey);
    } catch(e){
      serverOK = false;
      setStatus("local", "stLocal"); footKey = "footPublic"; $("footNote").textContent = t(footKey);
    }
  })();
})();
</script>
</body>
</html>
